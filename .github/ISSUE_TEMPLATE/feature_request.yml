name: Feature request
description: Suggest a new feature or improvement for DeskNote Sidebar
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe it from the user's point of view.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the scenario where the current app falls short.
      placeholder: "When I have many notes, I can't..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work? The more concrete, the better.
      placeholder: "Add a search box at the top of the sidebar that filters notes as I type..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative designs you've thought of.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, links, or reference apps that do this well.
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
